services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: idea2strategy_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d idea2strategy_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  flyway:
    image: flyway/flyway:11
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "-url=jdbc:postgresql://postgres:5432/idea2strategy_test"
      - "-user=postgres"
      - "-password=postgres"
      - "-connectRetries=20"
      - "migrate"
    volumes:
      - "./db/migration:/flyway/sql:ro"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports:
      - "59000:9000"
      - "59001:9001"
