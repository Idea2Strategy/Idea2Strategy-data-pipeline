name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: pipeline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  localstack-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install S3 integration dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-s3-test.txt
      - name: Start LocalStack S3
        run: docker compose -f docker-compose.localstack.yml up -d --wait
      - name: Run LocalStack storage integration
        env:
          LOCALSTACK_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: python -m unittest discover -s tests -p "test_storage_adapter_localstack.py" -v
      - name: Show LocalStack logs after failure
        if: failure()
        run: docker compose -f docker-compose.localstack.yml logs --no-color
      - name: Stop LocalStack
        if: always()
        run: docker compose -f docker-compose.localstack.yml down -v
